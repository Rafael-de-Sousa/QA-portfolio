<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja QA Teste</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
	
	<header class="container.liquid bg-black text-light text-center p-4">
		<h1>Loja QA Teste</h1>
	</header>
	
    <!-- LOGIN -->
    <section>
        <h2>Login</h2>
        <input type="email" placeholder="Email" id="login-email" data-cy="login-email">
        <input type="password" placeholder="Senha" id="login-password" data-cy="login-password">
        <button onclick="login()" data-cy="login-btn">Entrar</button>
        <p id="login-message" data-cy="login-message"></p>
    </section>

    <hr>

    <!-- CADASTRO -->
    <section>
        <h2>Cadastro</h2>
        <input type="text" placeholder="Nome" id="register-name" data-cy="register-name">
        <input type="email" placeholder="Email" id="register-email" data-cy="register-email">
        <input type="password" placeholder="Senha" id="register-password" data-cy="register-password">
        <button onclick="register()" data-cy="register-btn">Cadastrar</button>
        <p id="register-message" data-cy="register-message"></p>
    </section>

    <hr>

    <!-- BUSCA -->
    <section>
        <h2>Buscar Produto</h2>
        <input type="text" id="search-input" placeholder="Digite o nome..." data-cy="search-input">
        <button onclick="searchProduct()" data-cy="search-btn">Buscar</button>
    </section>

    <hr>

    <!-- FILTRO -->
    <section>
        <h2>Filtrar por Categoria</h2>
        <select id="category-filter" onchange="filterCategory()" data-cy="category-filter">
            <option value="all">Todos</option>
            <option value="eletronico">Eletrônicos</option>
            <option value="roupa">Roupas</option>
        </select>
    </section>

    <hr>

    <!-- PRODUTOS -->
    <section>
        <h2>Produtos</h2>
        <div id="product-list" data-cy="product-list"></div>
    </section>

    <hr>

    <!-- CARRINHO -->
    <section>
        <h2>Carrinho</h2>
        <ul id="cart-list" data-cy="cart-list"></ul>
        <p>Total: R$ <span id="cart-total" data-cy="cart-total">0</span></p>
        <button onclick="clearCart()" data-cy="clear-cart">Limpar Carrinho</button>
    </section>
	
	<footer class="container.liquid bg-black text-light text-center p-3">
		<a>Rafael de Sousa | 2026</a>
	</footer>

<script src="script.js"></script>
</body>
</html>
