name: Automação Cypress - Portfólio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Permite rodar manualmente pela aba Actions

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    # Não cancela os outros projetos se um deles falhar
    strategy:
      fail-fast: false
      matrix:
        # COLOQUE AQUI OS NOMES EXATOS DAS SUAS 3 PASTAS:
        project: [lojaQA-Teste, loja-virtual, sistema-de-agendamento]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Executar testes Cypress (${{ matrix.project }})
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./${{ matrix.project }}

      - name: Salvar screenshots de falha (${{ matrix.project }})
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.project }}
          path: ${{ matrix.project }}/cypress/screenshots

      - name: Salvar vídeos da execução (${{ matrix.project }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-${{ matrix.project }}
          path: ${{ matrix.project }}/cypress/videos
